<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiviX</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: #e2e8f0;
}

/* NAV */
.nav {
    position: sticky;
    top:0;
    display:flex;
    justify-content:space-between;
    padding:16px 24px;
    backdrop-filter: blur(14px);
    background: rgba(15,23,42,0.7);
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.nav b {
    font-size:18px;
    letter-spacing:0.5px;
}

.nav button {
    background:#1e293b;
    border:1px solid rgba(255,255,255,0.1);
    padding:6px 14px;
    border-radius:999px;
    color:white;
    cursor:pointer;
    transition:0.25s;
}
.nav button:hover { background:#334155; }

/* HERO */
.hero {
    text-align:center;
    padding:60px 20px 20px;
}
.hero h1 {
    font-size:42px;
    background: linear-gradient(90deg,#3b82f6,#22c55e);
    -webkit-background-clip:text;
    color:transparent;
}
.hero p { opacity:0.7; margin-top:8px; }

.counter {
    margin-top:12px;
    font-size:14px;
    opacity:0.8;
}

/* CONTAINER */
.container {
    max-width:720px;
    margin:auto;
    padding:20px;
}

/* CARD */
.card {
    background: rgba(17,24,39,0.8);
    backdrop-filter: blur(12px);
    padding:18px;
    margin-bottom:16px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.05);
    transition:0.25s;
    box-shadow: 0 0 0 transparent;
}
.card:hover {
    transform: translateY(-5px);
    border-color:#3b82f6;
    box-shadow: 0 10px 30px rgba(59,130,246,0.2);
}

.card img, .card video {
    width:100%;
    border-radius:12px;
    margin-top:10px;
}

.meta {
    font-size:12px;
    opacity:0.6;
    margin-bottom:6px;
}

/* FORM */
.form-box {
    margin-top:20px;
    padding:20px;
    background: rgba(17,24,39,0.8);
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.05);
}

input, textarea, select {
    width:100%;
    margin:10px 0;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#020617;
    color:white;
}

/* BUTTONS */
button {
    padding:10px 16px;
    background:#2563eb;
    border:none;
    color:white;
    border-radius:999px;
    cursor:pointer;
    transition:0.2s;
}
button:hover { transform:scale(1.06); background:#1d4ed8; }
button:active { transform:scale(0.95); }

.actions {
    display:flex;
    gap:10px;
    margin-top:12px;
}

/* LIKE BUTTON */
.like-btn {
    background:#1e293b;
}

.like-btn.liked {
    background:#16a34a;
}

/* SIGNATURE */
.signature {
    position: fixed;
    bottom: 12px;
    right: 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
}
</style>
</head>

<body>

<div class="nav">
    <div><b>CiviX</b></div>
    <div>
        <button onclick="location.href='fixmyarea+contact.html'">Contact</button>
        <button onclick="location.href='fixmyarea+donations.html'">Donate</button>
    </div>
</div>

<div class="hero">
    <h1>CiviX</h1>
    <p>Report. Amplify. Force action.</p>
    <div id="count" class="counter">Loading...</div>
</div>

<div class="container">

<div class="form-box">
<h3>Report Issue</h3>

<select id="category">
<option>Pothole</option>
<option>Garbage</option>
<option>Water Leak</option>
<option>Streetlight</option>
<option>Pollution</option>
<option>Other</option>
</select>

<input id="location" placeholder="Location">
<textarea id="desc" placeholder="Description"></textarea>
<input type="file" id="media">

<button onclick="submitIssue()">Post Issue</button>
</div>

<hr style="margin:30px 0; opacity:0.2;">

<h3>Top Issues</h3>
<div id="feed"></div>

</div>

<div class="signature">AK</div>

<script>
const client = supabase.createClient(
  "https://bxtsttllyscfvawvhhas.supabase.co",
  "sb_publishable_gwJp2GV1r1lqKM5siFCeig_9JkaqV6o"
);

// LOAD ISSUES
async function loadIssues(){
    const { data } = await client
        .from("issues")
        .select("*")
        .order("upvotes", { ascending:false });

    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    data.forEach(issue=>{
        const liked = localStorage.getItem("liked_" + issue.id);

        let media = "";
        if(issue.media_url){
            media = issue.media_url.includes(".mp4")
                ? `<video controls src="${issue.media_url}"></video>`
                : `<img src="${issue.media_url}">`;
        }

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <div class="meta">${issue.category}</div>
            <b>📍 ${issue.location}</b><br>
            ${issue.description}
            ${media}

            <div class="actions">
                <button class="like-btn ${liked ? 'liked' : ''}">
                    👍 <span>${issue.upvotes}</span>
                </button>

                <button onclick="share('${issue.category}','${issue.location}')">
                    Share
                </button>
            </div>
        `;

        const likeBtn = div.querySelector(".like-btn");
        const countSpan = likeBtn.querySelector("span");

        likeBtn.onclick = async () => {
            if(localStorage.getItem("liked_" + issue.id)) return;

            likeBtn.classList.add("liked");

            let newCount = issue.upvotes + 1;
            countSpan.innerText = newCount;

            localStorage.setItem("liked_" + issue.id, true);

            await client
                .from("issues")
                .update({ upvotes: newCount })
                .eq("id", issue.id);
        };

        feed.appendChild(div);
    });
}

// COUNT
async function loadCount(){
    const { count } = await client
        .from("issues")
        .select("*", { count:'exact', head:true });

    document.getElementById("count").innerText =
        count + " issues reported";
}

// POST ISSUE
async function submitIssue(){
    const category = categoryEl.value;
    const location = locationEl.value;
    const description = descEl.value;
    const file = mediaEl.files[0];

    if(!location || !description){
        alert("Fill all fields");
        return;
    }

    let mediaUrl = null;

    if(file){
        const fileName = Date.now() + "-" + file.name;

        const { error } = await client.storage
            .from("issues-media")
            .upload(fileName, file);

        if(error){
            alert("Upload failed");
            return;
        }

        mediaUrl = `https://bxtsttllyscfvawvhhas.supabase.co/storage/v1/object/public/issues-media/${fileName}`;
    }

    await client.from("issues").insert([{
        category,
        location,
        description,
        media_url: mediaUrl,
        upvotes: 0,
        status: "Reported"
    }]);

    locationEl.value = "";
    descEl.value = "";
    mediaEl.value = "";

    loadIssues();
    loadCount();
}

// SHARE
function share(category, location){
    const text = `🚨 ${category} issue in ${location}. Check CiviX`;

    if(navigator.share){
        navigator.share({ text });
    } else {
        navigator.clipboard.writeText(text);
        alert("Copied");
    }
}

// CACHE DOM
const categoryEl = document.getElementById("category");
const locationEl = document.getElementById("location");
const descEl = document.getElementById("desc");
const mediaEl = document.getElementById("media");

// INIT
loadIssues();
loadCount();
</script>

</body>
</html>
