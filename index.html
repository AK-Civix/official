<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiviX</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at top,#0f172a,#020617);
    color:#e2e8f0;
}

/* NAV */
.nav{
    position:sticky;top:0;
    display:flex;justify-content:space-between;
    padding:16px 24px;
    backdrop-filter: blur(14px);
    background: rgba(15,23,42,0.7);
}

/* HERO */
.hero{text-align:center;padding:60px 20px 20px}
.hero h1{
    font-size:44px;
    background:linear-gradient(90deg,#3b82f6,#22c55e);
    -webkit-background-clip:text;
    color:transparent;
}
.counter{opacity:0.8;margin-top:10px}

/* CONTROLS */
.controls{
    max-width:720px;margin:auto;
    display:flex;gap:10px;padding:10px;
}
.controls input,.controls select{
    flex:1;padding:10px;border-radius:10px;
    background:#020617;border:none;color:white;
}

/* CONTAINER */
.container{max-width:720px;margin:auto;padding:20px}

/* CARD */
.card{
    background: rgba(17,24,39,0.9);
    padding:18px;margin-bottom:16px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.05);
    transition:0.3s;
}
.card:hover{
    transform:translateY(-6px);
    border-color:#3b82f6;
}

.meta{font-size:12px;opacity:0.6}
.status{
    font-size:10px;
    padding:2px 8px;
    border-radius:999px;
    margin-left:6px;
}
.reported{background:#334155}
.progress{background:#f59e0b}
.resolved{background:#16a34a}

.card img,.card video{
    width:100%;
    border-radius:12px;
    margin-top:10px;
}

/* BUTTONS */
.actions{display:flex;gap:10px;margin-top:12px}
button{
    padding:8px 14px;
    border-radius:999px;
    border:none;
    background:#2563eb;
    color:white;cursor:pointer;
}
.like-btn{background:#1e293b}
.like-btn.liked{background:#16a34a}

/* COMMENTS */
.comments{
    margin-top:12px;
    border-top:1px solid rgba(255,255,255,0.08);
    padding-top:10px;
}
.comment{
    font-size:13px;
    margin-top:6px;
    opacity:0.85;
}
.comment-box{
    display:flex;
    gap:6px;
    margin-top:8px;
}
.comment-box input{
    flex:1;
    padding:6px;
    border-radius:8px;
    border:none;
    background:#020617;
    color:white;
}

/* FORM */
.form-box{
    background: rgba(17,24,39,0.9);
    padding:20px;
    border-radius:18px;
}
input,textarea,select{
    width:100%;
    margin:10px 0;
    padding:12px;
    border-radius:10px;
    background:#020617;
    border:none;color:white;
}

/* TOAST */
.toast{
    position:fixed;bottom:20px;left:50%;
    transform:translateX(-50%);
    background:#020617;
    padding:10px 16px;
    border-radius:999px;
    opacity:0;
    transition:0.3s;
}
.toast.show{opacity:1}

/* SIDE TICKER */
.side{
    position:fixed;
    top:0;
    height:100%;
    width:25px;
    writing-mode:vertical-rl;
    opacity:0.12;
    pointer-events:none;
    font-size:12px;
}
.left{left:0;animation:up 10s linear infinite}
.right{right:0;animation:down 10s linear infinite}

@keyframes up{
0%{transform:translateY(100%)}
100%{transform:translateY(-100%)}
}
@keyframes down{
0%{transform:translateY(-100%)}
100%{transform:translateY(100%)}
}

/* EMPTY */
.empty{text-align:center;opacity:0.6;margin-top:20px}

.signature{
    position:fixed;
    bottom:10px;
    right:14px;
    font-size:12px;
    opacity:0.4;
}
</style>
</head>

<body>

<div class="side left">Aniruddh Kumar • Aniruddh Kumar •</div>
<div class="side right">Aniruddh Kumar • Aniruddh Kumar •</div>

<div class="nav">
<b>CiviX</b>
</div>

<div class="hero">
<h1>CiviX</h1>
<p>Report. Amplify. Force action.</p>
<div id="count" class="counter"></div>
</div>

<div class="controls">
<input id="search" placeholder="Search location...">
<select id="sort">
<option value="top">Top</option>
<option value="latest">Latest</option>
</select>
</div>

<div class="container">

<div class="form-box">
<h3>Report Issue</h3>

<select id="category">
<option>Pothole</option>
<option>Garbage</option>
<option>Water Leak</option>
<option>Streetlight</option>
<option>Pollution</option>
<option>Other</option>
</select>

<input id="location" placeholder="Location">
<textarea id="desc" placeholder="Description"></textarea>
<input type="file" id="media">

<button onclick="submitIssue()">Post</button>
</div>

<hr style="margin:30px 0;opacity:0.2">

<div id="feed"></div>

</div>

<div id="toast" class="toast"></div>
<div class="signature">AK</div>

<script>
const client = supabase.createClient(
"https://bxtsttllyscfvawvhhas.supabase.co",
"sb_publishable_gwJp2GV1r1lqKM5siFCeig_9JkaqV6o"
);

const feed=document.getElementById("feed");

function toast(msg){
const t=document.getElementById("toast");
t.innerText=msg;
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),2000);
}

async function loadIssues(){
let { data } = await client.from("issues").select("*");

feed.innerHTML="";

if(!data || data.length===0){
feed.innerHTML="<div class='empty'>No issues yet</div>";
return;
}

data.forEach(issue=>{
const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<div class="meta">${issue.category}</div>
<b>📍 ${issue.location}</b><br>
${issue.description}

<div class="actions">
<button onclick="like(${issue.id})">👍 ${issue.upvotes}</button>
<button onclick="share('${issue.category}','${issue.location}')">Share</button>
</div>

<div class="comments" id="c-${issue.id}"></div>

<div class="comment-box">
<input id="i-${issue.id}" placeholder="Comment...">
<button onclick="addComment(${issue.id})">Post</button>
</div>
`;

feed.appendChild(div);

loadComments(issue.id);
});
}

async function loadComments(id){
const { data } = await client
.from("comments")
.select("*")
.eq("issue_id",id);

const el=document.getElementById("c-"+id);
if(!data.length){
el.innerHTML="<div class='comment'>No comments</div>";
return;
}
el.innerHTML=data.map(c=>`<div class='comment'>💬 ${c.text}</div>`).join("");
}

async function addComment(id){
const input=document.getElementById("i-"+id);
if(!input.value) return;

await client.from("comments").insert([{issue_id:id,text:input.value}]);

input.value="";
loadComments(id);
}

async function like(id){
let { data } = await client.from("issues").select("*").eq("id",id).single();
let newCount=data.upvotes+1;

await client.from("issues").update({upvotes:newCount}).eq("id",id);
loadIssues();
}

async function submitIssue(){
const category=document.getElementById("category").value;
const location=document.getElementById("location").value;
const description=document.getElementById("desc").value;

if(!location||!description){
toast("Fill fields");
return;
}

await client.from("issues").insert([{
category,location,description,upvotes:0
}]);

toast("Posted");
loadIssues();
}

function share(cat,loc){
navigator.clipboard.writeText(`🚨 ${cat} in ${loc}`);
toast("Copied");
}

loadIssues();
</script>

</body>
</html>
