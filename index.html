<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiviX</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at top,#0f172a,#020617);
    color:#e2e8f0;
}

/* NAV */
.nav{
    position:sticky;top:0;
    display:flex;justify-content:space-between;
    padding:16px 24px;
    backdrop-filter: blur(14px);
    background: rgba(15,23,42,0.7);
}
.nav button{
    background:#1e293b;border:none;
    padding:6px 14px;border-radius:999px;
    color:white;cursor:pointer;
}

/* HERO */
.hero{text-align:center;padding:60px 20px 20px}
.hero h1{
    font-size:44px;
    background:linear-gradient(90deg,#3b82f6,#22c55e);
    -webkit-background-clip:text;
    color:transparent;
}
.hero p{
    color:#64748b; /* subtle dark color for legible but subdued text */
    margin-top:6px;
    font-weight:500;
}
.counter{opacity:0.8;margin-top:10px}

/* CONTROLS */
.controls{
    max-width:720px;margin:auto;
    display:flex;gap:10px;padding:10px;
}
.controls input,.controls select{
    flex:1;padding:10px;border-radius:10px;
    background:#020617;border:none;color:white;
}

/* CONTAINER */
.container{max-width:720px;margin:auto;padding:20px}

/* CARD */
.card{
    background: rgba(17,24,39,0.85);
    padding:18px;margin-bottom:16px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.05);
    transition:0.3s;
}
.card:hover{
    transform:translateY(-6px);
    border-color:#3b82f6;
}

.meta{font-size:12px;opacity:0.6;margin-bottom:4px}
.status{
    font-size:11px;
    padding:3px 8px;
    border-radius:999px;
    margin-left:6px;
}
.reported{background:#334155}
.progress{background:#f59e0b}
.resolved{background:#16a34a}

.card img, .card video{
    width:100%;border-radius:12px;margin-top:10px;
}

/* BUTTONS */
.actions{display:flex;gap:10px;margin-top:12px}
button{
    padding:8px 14px;
    border-radius:999px;
    border:none;
    background:#2563eb;
    color:white;cursor:pointer;
}
.like-btn{background:#1e293b;transition:0.2s}
.like-btn.liked{background:#16a34a}

/* FORM */
.form-box{
    background: rgba(17,24,39,0.85);
    padding:20px;border-radius:18px;
}
input,textarea,select{
    width:100%;margin:10px 0;
    padding:12px;border-radius:10px;
    background:#020617;border:none;color:white;
}

/* TOAST */
.toast{
    position:fixed;bottom:20px;left:50%;
    transform:translateX(-50%);
    background:#020617;padding:10px 16px;
    border-radius:999px;opacity:0;
    transition:0.3s;
}
.toast.show{opacity:1}

/* EMPTY */
.empty{
    text-align:center;
    opacity:0.6;
    margin-top:20px;
}

/* SIGN */
.signature{
    position:fixed;
    bottom:12px;right:16px;
    font-size:12px;opacity:0.4;
}

/* SIDEBAR SCROLLING NAME */
.marquee-left, .marquee-right{
    position:fixed;
    top:0; bottom:0;
    width:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    z-index:5;
}
.marquee-left{left:0}
.marquee-right{right:0}

.marquee-left span, .marquee-right span{
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size:14px;
    color:white;
    animation: scroll 10s linear infinite;
}

@keyframes scroll{
    0%{transform: translateY(100%)}
    100%{transform: translateY(-100%)}
}
</style>
</head>

<body>

<div class="nav">
<b>CiviX</b>
<div>
<button onclick="location.href='fixmyarea+contact.html'">Contact</button>
<button onclick="location.href='fixmyarea+donation.html'">Donate</button>
</div>
</div>

<div class="hero">
<h1>CiviX</h1>
<p>AK</p>
<div id="count" class="counter">Loading...</div>
</div>

<div class="controls">
<input id="search" placeholder="Search location...">
<select id="sort">
<option value="top">Top</option>
<option value="latest">Latest</option>
</select>
</div>

<div class="container">

<div class="form-box">
<h3>Report Issue</h3>

<select id="category">
<option>Pothole</option>
<option>Garbage</option>
<option>Water Leak</option>
<option>Streetlight</option>
<option>Pollution</option>
<option>Other</option>
</select>

<input id="location" placeholder="Location (+City)">
<textarea id="desc" placeholder="Description"></textarea>
<input type="file" id="media">

<button onclick="submitIssue()">Post Issue</button>
</div>

<hr style="margin:30px 0;opacity:0.2">

<h3>Top Issues</h3>
<div id="feed"></div>

</div>

<div id="toast" class="toast"></div>
<div class="signature">AK</div>

<div class="marquee-left"><span>Aniruddh Kumar</span></div>
<div class="marquee-right"><span>Aniruddh Kumar</span></div>

<script>
const client = supabase.createClient(
"https://bxtsttllyscfvawvhhas.supabase.co",
"sb_publishable_gwJp2GV1r1lqKM5siFCeig_9JkaqV6o"
);

const searchEl = document.getElementById("search");
const sortEl = document.getElementById("sort");
const feed = document.getElementById("feed");

function toast(msg){
    const t=document.getElementById("toast");
    t.innerText=msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),2000);
}

async function loadIssues(){
    let { data } = await client.from("issues").select("*");

    if(sortEl.value==="top"){
        data.sort((a,b)=>b.upvotes-a.upvotes);
    } else {
        data.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    }

    const query = searchEl.value.toLowerCase();
    data = data.filter(i=>i.location.toLowerCase().includes(query));

    feed.innerHTML="";

    if(data.length===0){
        feed.innerHTML=`<div class="empty">No issues found</div>`;
        return;
    }

    data.forEach(issue=>{
        const liked = localStorage.getItem("liked_"+issue.id);

        let media="";
        if(issue.media_url){
            media = issue.media_url.includes(".mp4")
            ? `<video controls src="${issue.media_url}"></video>`
            : `<img src="${issue.media_url}">`;
        }

        const statusClass = issue.status==="Resolved"?"resolved":
                            issue.status==="In Progress"?"progress":"reported";

        const div=document.createElement("div");
        div.className="card";

        div.innerHTML=`
        <div class="meta">
            ${issue.category}
            <span class="status ${statusClass}">${issue.status || "Reported"}</span>
        </div>

        <b>📍 ${issue.location}</b><br>
        ${issue.description}
        ${media}

        <div class="actions">
            <button class="like-btn ${liked?'liked':''}" onclick="like(${issue.id}, this)">
            👍 <span>${issue.upvotes}</span>
            </button>

            <button onclick="share('${issue.category}','${issue.location}')">
            Share
            </button>
        </div>
        `;
        feed.appendChild(div);
    });
}

async function loadCount(){
    const { count } = await client
    .from("issues")
    .select("*",{count:'exact',head:true});

    document.getElementById("count").innerText =
    count + " issues reported";
}

async function submitIssue(){
    const category=document.getElementById("category").value;
    const location=document.getElementById("location").value;
    const description=document.getElementById("desc").value;
    const file=document.getElementById("media").files[0];

    if(!location||!description){
        toast("Fill all fields");
        return;
    }

    let mediaUrl=null;

    if(file){
        const name=Date.now()+"-"+file.name;

        const { error } = await client.storage
        .from("issues-media")
        .upload(name,file);

        if(error){
            toast("Upload failed");
            return;
        }

        mediaUrl=`https://bxtsttllyscfvawvhhas.supabase.co/storage/v1/object/public/issues-media/${name}`;
    }

    await client.from("issues").insert([{
        category,location,description,
        media_url:mediaUrl,
        upvotes:0,
        status:"Reported"
    }]);

    toast("Posted");

    document.getElementById("location").value="";
    document.getElementById("desc").value="";
    document.getElementById("media").value="";

    loadIssues();
    loadCount();
}

function share(category,location){
    const text=`🚨 ${category} in ${location} via CiviX`;

    navigator.clipboard.writeText(text);
    toast("Copied");
}

async function like(id, btn){
    if(localStorage.getItem("liked_"+id)) return;

    localStorage.setItem("liked_"+id,true);
    btn.classList.add("liked");

    const span = btn.querySelector("span");
    const current = parseInt(span.innerText);
    span.innerText = current+1;

    const { data } = await client.from("issues").select("*").eq("id",id).single();
    await client.from("issues").update({upvotes:data.upvotes+1}).eq("id",id);
}

searchEl.oninput=loadIssues;
sortEl.onchange=loadIssues;

loadIssues();
loadCount();
</script>

</body>
</html>
