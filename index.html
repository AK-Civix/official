<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiviX</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: #e2e8f0;
}

/* NAV */
.nav {
    position: sticky;
    top:0;
    display:flex;
    justify-content:space-between;
    padding:16px 24px;
    backdrop-filter: blur(14px);
    background: rgba(15,23,42,0.7);
    border-bottom:1px solid rgba(255,255,255,0.05);
}
.nav b { font-size:18px; }
.nav button {
    background:#1e293b;
    border:1px solid rgba(255,255,255,0.1);
    padding:6px 14px;
    border-radius:999px;
    color:white;
    cursor:pointer;
    transition:0.25s;
}
.nav button:hover { background:#334155; }

/* DASHBOARD */
.container {
    max-width:720px;
    margin:auto;
    padding:60px 20px;
    text-align:center;
}

h1 {
    font-size:42px;
    background: linear-gradient(90deg,#3b82f6,#22c55e);
    -webkit-background-clip:text;
    color:transparent;
    margin-bottom:10px;
}

p { opacity:0.7; margin-bottom:30px; font-size:18px; }

button.dashboard-btn {
    padding:14px 24px;
    margin:10px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    background:#2563eb;
    color:white;
    font-size:16px;
    transition:0.2s;
}
button.dashboard-btn:hover { transform:scale(1.05); background:#1d4ed8; }
button.dashboard-btn:active { transform:scale(0.95); }

.stats { margin-top:30px; font-size:16px; opacity:0.8; }
</style>
</head>

<body>

<div class="nav">
    <div><b>CiviX</b></div>
    <div>
        <button onclick="location.href='contact.html'">Contact</button>
        <button onclick="location.href='donations.html'">Donate</button>
    </div>
</div>

<div class="container">
    <h1>Welcome to CiviX</h1>
    <p>Track, report, and amplify issues in your area. Together we can make cities safer.</p>

    <button class="dashboard-btn" onclick="location.href='report.html'">📢 Report an Issue</button>
    <button class="dashboard-btn" onclick="location.href='feed.html'">🗂 View Issues</button>

    <div class="stats" id="stats">Loading stats...</div>
</div>

<script>
const client = supabase.createClient(
  "https://bxtsttllyscfvawvhhas.supabase.co",
  "sb_publishable_gwJp2GV1r1lqKM5siFCeig_9JkaqV6o"
);

async function loadStats(){
    const { count } = await client
        .from("issues")
        .select("*",{count:'exact',head:true});
    document.getElementById("stats").innerText = count + " issues reported so far";
}

loadStats();
</script>

</body>
</html>
