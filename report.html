<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiviX - Report Issue</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, sans-serif; background: radial-gradient(circle at top, #0f172a, #020617); color:#e2e8f0; line-height:1.6; }

.nav {
    position: sticky; top:0; display:flex; justify-content:space-between; padding:16px 24px; backdrop-filter:blur(14px); background:rgba(15,23,42,0.8); border-bottom:1px solid rgba(255,255,255,0.05);
}
.nav b { font-size:18px; }
.nav button { background:#1e293b; border:1px solid rgba(255,255,255,0.1); padding:6px 14px; border-radius:999px; color:white; cursor:pointer; transition:0.25s; }
.nav button:hover { background:#334155; transform:scale(1.05); }

.container { max-width:600px; margin:auto; padding:40px 20px; display:flex; flex-direction:column; gap:30px; }

.dashboard-btn { padding:12px 20px; border-radius:999px; border:none; cursor:pointer; background:#2563eb; color:white; font-size:16px; transition:0.25s; }
.dashboard-btn:hover { transform:scale(1.05); background:#1d4ed8; }
.dashboard-btn:active { transform:scale(0.95); }

.form-card { background: rgba(17,24,39,0.75); backdrop-filter:blur(12px); padding:24px; border-radius:18px; border:1px solid rgba(255,255,255,0.05); transition:0.25s; }
.form-card:hover { transform:scale(1.02); }

.form-card h2 { margin-bottom:16px; color:#3b82f6; }
input, textarea, select { width:100%; margin:10px 0; padding:12px; border-radius:10px; border:none; background:#020617; color:white; transition:0.25s; }
input:focus, textarea:focus, select:focus { outline:none; background:#1e293b; }

button.submit-btn { padding:12px 20px; border-radius:999px; border:none; cursor:pointer; background:#16a34a; color:white; transition:0.25s; }
button.submit-btn:hover { transform:scale(1.05); background:#15803d; }
button.submit-btn:active { transform:scale(0.95); }

.tips { background:#1e293b; padding:16px; border-radius:16px; border-left:4px solid #3b82f6; font-size:14px; opacity:0.85; }

.signature { text-align:center; margin-top:40px; font-size:12px; color:rgba(255,255,255,0.4); }
</style>
</head>

<body>

<div class="nav">
    <div><b>CiviX</b></div>
    <div>
        <button onclick="location.href='contact.html'">Contact</button>
        <button onclick="location.href='donations.html'">Donate</button>
    </div>
</div>

<div class="container">
    <button class="dashboard-btn" onclick="location.href='index.html'">⬅ Back to Dashboard</button>

    <!-- Tips -->
    <div class="tips">
        <b>Tips for Effective Reporting:</b>
        <ul>
            <li>Provide a clear description of the issue.</li>
            <li>Include precise location details.</li>
            <li>Add photos or videos if possible.</li>
            <li>Be specific about urgency or safety concerns.</li>
        </ul>
    </div>

    <!-- Form Card -->
    <div class="form-card">
        <h2>Report a Civic Issue</h2>
        <select id="category">
            <option>Pothole</option>
            <option>Garbage</option>
            <option>Water Leak</option>
            <option>Streetlight</option>
            <option>Pollution</option>
            <option>Other</option>
        </select>

        <input id="location" placeholder="Location">
        <textarea id="desc" placeholder="Description"></textarea>
        <input type="file" id="media">

        <button class="submit-btn" onclick="submitIssue()">Submit Report</button>
    </div>
</div>

<div class="signature">AK</div>

<script>
const client = supabase.createClient(
  "https://bxtsttllyscfvawvhhas.supabase.co",
  "sb_publishable_gwJp2GV1r1lqKM5siFCeig_9JkaqV6o"
);

const categoryEl = document.getElementById("category");
const locationEl = document.getElementById("location");
const descEl = document.getElementById("desc");
const mediaEl = document.getElementById("media");

async function submitIssue(){
    const category = categoryEl.value;
    const location = locationEl.value;
    const description = descEl.value;
    const file = mediaEl.files[0];

    if(!location || !description){
        alert("Please fill all fields.");
        return;
    }

    let mediaUrl = null;

    if(file){
        const fileName = Date.now() + "-" + file.name;
        const { error } = await client.storage.from("issues-media").upload(fileName,file);
        if(error){ alert("Upload failed."); return; }
        mediaUrl = `https://bxtsttllyscfvawvhhas.supabase.co/storage/v1/object/public/issues-media/${fileName}`;
    }

    await client.from("issues").insert([{
        category,
        location,
        description,
        media_url: mediaUrl,
        upvotes:0,
        status:"Reported"
    }]);

    locationEl.value="";
    descEl.value="";
    mediaEl.value="";
    alert("Issue submitted successfully!");
}
</script>

</body>
</html>
