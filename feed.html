<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Antecessum Feed</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body { font-family: sans-serif; background:#f0fdf4; }
.container { max-width:800px; margin:auto; padding:20px; }
.card { background:white; padding:20px; border-radius:12px; margin-bottom:20px; }
button { padding:6px 12px; border:none; border-radius:999px; background:#10b981; color:white; cursor:pointer; }
.comments { display:none; margin-top:10px; }
.comments.open { display:block; }
</style>
</head>

<body>
<div class="container">
<h1>🔥 Smart Feed</h1>
<div id="feed"></div>
</div>

<script>
const client = supabase.createClient(
 "https://bxtsttllyscfvawvhhas.supabase.co",
 "sb_publishable_gwJp2GV1r1lqKM5siFCeig_9JkaqV6o"
);

// 🔑 stable user id
let userId = localStorage.getItem("uid");
if(!userId){
    userId = "u_" + Math.random().toString(36).substring(2,8);
    localStorage.setItem("uid", userId);
}

// 🔥 REAL SCORE FUNCTION
function calculateScore(issue){

    const upvotes = issue.upvotes || 0;

    let importance = 5;
    if(issue.importance_votes){
        let vals = Object.values(issue.importance_votes);
        if(vals.length){
            importance = vals.reduce((a,b)=>a+b,0) / vals.length;
        }
    }

    const created = new Date(issue.created_at);
    const last = new Date(issue.last_activity || issue.created_at);

    const hoursOld = (Date.now() - created) / (1000*60*60);
    const hoursActive = (Date.now() - last) / (1000*60*60);

    const recency = 50 / (1 + hoursOld);
    const trend = 30 / (1 + hoursActive);

    const severity = issue.severity || 5;

    return (
        upvotes * 10 +
        importance * 15 +
        recency +
        trend +
        severity * 5
    );
}

// LOAD EVERYTHING
async function loadIssues(){

    const { data: issues } = await client.from("issues").select("*");
    const { data: comments } = await client.from("comments").select("*");

    // attach comments
    const commentMap = {};
    comments.forEach(c=>{
        if(!commentMap[c.issue_id]) commentMap[c.issue_id]=[];
        commentMap[c.issue_id].push(c);
    });

    // compute scores
    issues.forEach(i=>{
        i.score = calculateScore(i);
    });

    // sort
    issues.sort((a,b)=>b.score - a.score);

    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    issues.forEach(issue=>{

        // media fix
        let media = "";
        if(issue.media_url){
            if(issue.media_url.includes(".mp4")){
                media = `<video controls src="${issue.media_url}" style="width:100%"></video>`;
            } else {
                media = `<img src="${issue.media_url}" style="width:100%">`;
            }
        }

        // comments
        let cmts = (commentMap[issue.id] || [])
            .map(c=>`<p>${c.text}</p>`).join("");

        feed.innerHTML += `
        <div class="card">

            <b>${issue.category}</b> — Score: ${issue.score.toFixed(1)}
            <p>${issue.description}</p>
            <p>📍 ${issue.location}</p>

            ${media}

            <br><br>

            <button onclick="upvote(${issue.id},${issue.upvotes})">
                👍 ${issue.upvotes}
            </button>

            <button onclick="share('${issue.category}','${issue.location}')">
                Share
            </button>

            <button onclick="toggle(${issue.id})">
                Comments
            </button>

            <br><br>

            Importance:
            <input type="range" min="1" max="10"
                onchange="rate(${issue.id},this.value)">

            <div class="comments" id="c-${issue.id}">
                ${cmts}
                <input id="i-${issue.id}">
                <button onclick="comment(${issue.id})">Post</button>
            </div>

        </div>`;
    });

    console.log("Scores:", issues.map(i=>({id:i.id,score:i.score})));
}

// ACTIONS

async function upvote(id,count){
    await client.from("issues")
    .update({
        upvotes: count+1,
        last_activity: new Date().toISOString()
    }).eq("id",id);

    loadIssues();
}

async function rate(id,val){
    const { data } = await client.from("issues")
    .select("importance_votes").eq("id",id).single();

    let votes = data.importance_votes || {};
    votes[userId] = parseInt(val);

    await client.from("issues")
    .update({
        importance_votes: votes,
        last_activity: new Date().toISOString()
    }).eq("id",id);

    loadIssues();
}

async function comment(id){
    const input = document.getElementById("i-"+id);

    if(!input.value) return;

    await client.from("comments").insert([
        { issue_id:id, text:input.value }
    ]);

    await client.from("issues")
    .update({ last_activity: new Date().toISOString() })
    .eq("id",id);

    input.value="";
    loadIssues();
}

function toggle(id){
    document.getElementById("c-"+id).classList.toggle("open");
}

function share(cat,loc){
    const text = `🚨 ${cat} issue in ${loc} on Antecessum`;

    if(navigator.share){
        navigator.share({ text });
    } else {
        navigator.clipboard.writeText(text);
        alert("Copied");
    }
}

loadIssues();
</script>

</body>
</html>
