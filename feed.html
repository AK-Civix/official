<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antecessum - Intelligent Feed</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body { font-family: system-ui; background:#f0fdf4; }
.container { max-width:900px; margin:auto; padding:20px; }
.card { background:white; padding:20px; border-radius:12px; margin-bottom:20px; }
button { padding:6px 12px; border:none; border-radius:999px; background:#10b981; color:white; cursor:pointer; }
.comments { display:none; margin-top:10px; }
.comments.open { display:block; }
</style>
</head>

<body>

<div class="container">
<h1>🔥 Smart Priority Feed</h1>
<div id="feed">Loading...</div>
</div>

<script>
const client = supabase.createClient(
  "https://bxtsttllyscfvawvhhas.supabase.co",
  "sb_publishable_gwJp2GV1r1lqKM5siFCeig_9JkaqV6o"
);

// CATEGORY SEVERITY MAP (CRITICAL)
function getSeverity(category){
    const map = {
        "Road": 8,
        "Water": 9,
        "Electricity": 9,
        "Garbage": 6,
        "Safety": 10,
        "Other": 5
    };
    return map[category] || 5;
}

// CALCULATE SCORE
function calculateScore(issue){

    const upvotes = issue.upvotes || 0;

    // Importance
    let importance = 5;
    if(issue.importance_votes){
        let vals = Object.values(issue.importance_votes);
        importance = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 5;
    }

    // Recency (newer = higher)
    const created = new Date(issue.created_at);
    const hours = (Date.now() - created.getTime()) / (1000*60*60);
    const recency = Math.max(0, 10 - hours); // decay

    // Severity
    const severity = issue.severity || getSeverity(issue.category);

    // Trend (activity boost)
    const last = new Date(issue.last_activity);
    const trendHours = (Date.now() - last.getTime()) / (1000*60*60);
    const trend = Math.max(0, 10 - trendHours);

    // FINAL SCORE
    return (upvotes*0.4) + (importance*0.25) + (recency*0.2) + (severity*0.1) + (trend*0.05);
}

// LOAD FEED
async function loadIssues(){

    const { data } = await client.from("issues").select("*");

    data.forEach(i => i.score = calculateScore(i));

    data.sort((a,b)=>b.score - a.score);

    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    for(let issue of data){

        const { data: comments } = await client
            .from("comments")
            .select("*")
            .eq("issue_id", issue.id);

        let commentsHTML = comments.map(c=>`<p>${c.text}</p>`).join("");

        feed.innerHTML += `
        <div class="card">

            <b>${issue.category}</b> (Score: ${issue.score.toFixed(2)})
            <p>${issue.description}</p>
            <p>📍 ${issue.location}</p>

            <button onclick="upvote(${issue.id},${issue.upvotes})">
                👍 ${issue.upvotes}
            </button>

            <button onclick="share('${issue.category}','${issue.location}')">
                Share
            </button>

            <button onclick="toggle(${issue.id})">
                Comments
            </button>

            <div>
                Importance:
                <input type="range" min="1" max="10"
                onchange="rate(${issue.id},this.value)">
            </div>

            <div class="comments" id="c-${issue.id}">
                ${commentsHTML}
                <input id="i-${issue.id}">
                <button onclick="comment(${issue.id})">Post</button>
            </div>

        </div>`;
    }
}

// UPVOTE
async function upvote(id,count){
    await client.from("issues")
        .update({ 
            upvotes: count+1,
            last_activity: new Date()
        })
        .eq("id",id);

    loadIssues();
}

// RATE
async function rate(id,val){
    const { data } = await client.from("issues").select("importance_votes").eq("id",id).single();

    let votes = data.importance_votes || {};
    const user = "u_"+Math.random();

    votes[user] = parseInt(val);

    await client.from("issues")
        .update({ 
            importance_votes: votes,
            last_activity: new Date()
        })
        .eq("id",id);

    loadIssues();
}

// COMMENT
async function comment(id){
    const input = document.getElementById("i-"+id);

    await client.from("comments").insert([
        { issue_id:id, text:input.value }
    ]);

    await client.from("issues")
        .update({ last_activity: new Date() })
        .eq("id",id);

    loadIssues();
}

// TOGGLE COMMENTS
function toggle(id){
    document.getElementById("c-"+id).classList.toggle("open");
}

// SHARE
function share(cat,loc){
    const text = `🚨 ${cat} issue in ${loc} on Antecessum`;

    if(navigator.share){
        navigator.share({ text });
    } else {
        navigator.clipboard.writeText(text);
        alert("Copied!");
    }
}

loadIssues();
</script>

</body>
</html>
