<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Antecessum</title>

<style>
/* GLOBAL */
body {
    margin:0;
    font-family: system-ui, sans-serif;
    background: linear-gradient(180deg, #eff6ff 0%, #f7f9fb 100%);
    color:#191c1e;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.contact-box {
    background:white;
    padding:40px 30px;
    border-radius:8px;
    box-shadow:0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    border: 1px solid #e2e8f0;
    text-align:center;
    max-width:400px;
}

.contact-box h1 {
    font-size:36px;
    color:#004ac6;
    margin-bottom:16px;
}

.contact-box p {
    font-size:16px;
    margin-bottom:16px;
    color:#434655;
}

.contact-box a {
    color:#2563eb;
    font-weight:bold;
    text-decoration:none;
}

.contact-box a:hover {
    text-decoration:underline;
}

.contact-box button {
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:4px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

.contact-box button:hover {
    background:#1d4ed8;
    transform:scale(1.02);
}

/* RESPONSIVE */
@media(max-width:500px){
    .contact-box {
        padding:30px 20px;
    }
    .contact-box h1 {
        font-size:28px;
    }
    .contact-box p {
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="contact-box">
    <h1>Contact Praxis</h1>
    <p>Reach out for volunteer registrations, partnerships, or feedback.</p>

    <p><strong>Email:</strong><br>
    <a href="mailto:support@praxisngo.org">support@praxisngo.org</a></p>

    <button onclick="window.location.href='index.html'">← Back</button>
</div>

</body>
</html>
