<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Antecessum</title>

<style>
/* GLOBAL */
body {
    margin:0;
    font-family: system-ui, sans-serif;
    background: linear-gradient(180deg,#f0fdf4 0%,#e6f7ef 100%);
    color:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.contact-box {
    background:white;
    padding:40px 30px;
    border-radius:20px;
    box-shadow:0 8px 24px rgba(0,0,0,0.15);
    text-align:center;
    max-width:400px;
}

.contact-box h1 {
    font-size:36px;
    color:#059669;
    margin-bottom:16px;
}

.contact-box p {
    font-size:16px;
    margin-bottom:16px;
    color:#065f46;
}

.contact-box a {
    color:#10b981;
    font-weight:bold;
    text-decoration:none;
}

.contact-box a:hover {
    text-decoration:underline;
}

.contact-box button {
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:999px;
    background:#10b981;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

.contact-box button:hover {
    background:#059669;
    transform:scale(1.05);
}

/* RESPONSIVE */
@media(max-width:500px){
    .contact-box {
        padding:30px 20px;
    }
    .contact-box h1 {
        font-size:28px;
    }
    .contact-box p {
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="contact-box">
    <h1>Contact</h1>
    <p>Reach out for partnerships, issues, or feedback.</p>

    <p><strong>Email:</strong><br>
    <a href="mailto:ak.fixmyarea@proton.me">ak.fixmyarea@proton.me</a></p>

    <button onclick="window.location.href='index.html'">← Back</button>
</div>

</body>
</html>
