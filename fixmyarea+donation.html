<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support | Antecessum</title>

<style>
/* GLOBAL */
body {
    margin:0;
    font-family: system-ui, sans-serif;
    background: linear-gradient(180deg, #eff6ff 0%, #f7f9fb 100%);
    color:#191c1e;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.support-box {
    background:white;
    padding:40px 30px;
    border-radius:8px;
    box-shadow:0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    border: 1px solid #e2e8f0;
    text-align:center;
    max-width:400px;
}

.support-box h1 {
    font-size:36px;
    color:#004ac6;
    margin-bottom:16px;
}

.support-box p {
    font-size:16px;
    margin-bottom:16px;
    color:#434655;
}

.support-box strong {
    color:#004ac6;
}

.support-box button {
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:4px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

.support-box button:hover {
    background:#1d4ed8;
    transform:scale(1.02);
}

/* SIGNATURE */
.signature {
    margin-top:20px;
    font-size:14px;
    color:rgba(0,0,0,0.35);
}

/* RESPONSIVE */
@media(max-width:500px){
    .support-box {
        padding:30px 20px;
    }
    .support-box h1 {
        font-size:28px;
    }
    .support-box p {
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="support-box">
    <h1>Support Praxis</h1>
    <p>If you want this platform to grow and help clean up Pune's streets, support us.</p>

    <p><strong>Phone:</strong><br>+91 7019844552</p>
    <p><strong>Email:</strong><br><a href="mailto:support@praxisngo.org" style="color:#2563eb; font-weight:bold; text-decoration:none;">support@praxisngo.org</a></p>

    <button onclick="window.location.href='index.html'">← Back</button>
    <div class="signature">Aniruddh Kumar</div>
</div>

</body>
</html>
