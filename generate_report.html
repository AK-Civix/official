<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antecessum - Generate Complaint Report</title>
<style>
  body { font-family: Arial, sans-serif; background:#f4f4f4; margin:0; padding:0; }
  header { background:#333; color:white; padding:20px; text-align:center; font-size:24px; font-family:'Segoe UI', sans-serif; }
  main { padding:30px; }
  form { max-width:600px; margin:20px auto; background:white; padding:25px; border-radius:8px; box-shadow:0 0 12px rgba(0,0,0,0.15); }
  input, textarea { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:4px; }
  button { padding:12px 25px; background:#333; color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px; margin-top:10px; }
  button:hover { background:#555; }
  #reportSection { display:none; max-width:650px; margin:30px auto; padding:25px; background:white; border-left:6px solid #333; border-radius:8px; box-shadow:0 0 12px rgba(0,0,0,0.15); font-family:'Times New Roman', serif; }
  #reportSection h3 { text-align:center; text-decoration:underline; margin-bottom:15px; }
  #reportSection p { margin:8px 0; line-height:1.5; }
  #reportSection .action-btns { display:flex; justify-content:center; gap:20px; margin-top:20px; }
  footer { text-align:center; padding:15px; font-style:italic; color:#555; }
</style>
</head>
<body>

<header>Antecessum - Complaint Report Generator</header>

<main>
  <form id="complaintForm">
    <label><strong>Full Name:</strong></label>
    <input type="text" id="name" required>

    <label><strong>Date:</strong></label>
    <input type="date" id="date" required>

    <label><strong>Location:</strong></label>
    <input type="text" id="location" required>

    <label><strong>Complaint Details:</strong></label>
    <textarea id="details" rows="5" required></textarea>

    <button type="button" onclick="generateReport()">Generate Report</button>
  </form>

  <div id="reportSection">
    <!-- Generated report will appear here -->
  </div>
</main>

<footer>Generated via Antecessum</footer>

<script>
function generateReport() {
  const name = document.getElementById('name').value;
  const date = document.getElementById('date').value;
  const location = document.getElementById('location').value;
  const details = document.getElementById('details').value;

  if (!name || !date || !location || !details) {
    alert("Please fill all fields.");
    return;
  }

  const report = `
    <h3>Formal Complaint Report</h3>
    <p><strong>Name:</strong> ${name}</p>
    <p><strong>Date:</strong> ${date}</p>
    <p><strong>Location:</strong> ${location}</p>
    <p><strong>Complaint Details:</strong><br>${details}</p>
    <br>
    <p style="text-align:right;"><strong>Authority Signature:</strong> ____________________</p>
    <div class="action-btns">
      <button onclick="printReport()">Print Report</button>
      <button onclick="goBack()">Back to Complaint Reports</button>
    </div>
  `;

  const section = document.getElementById('reportSection');
  section.innerHTML = report;
  section.style.display = 'block';
}

function printReport() {
  const reportContent = document.getElementById('reportSection').innerHTML;
  const originalContent = document.body.innerHTML;

  document.body.innerHTML = reportContent;
  window.print();
  document.body.innerHTML = originalContent;
}

function goBack() {
  window.location.href = "complaint_reports.html";
}
</script>

</body>
</html>
