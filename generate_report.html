<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praxis - Generate Complaint Report</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .generator-header {
            padding: 140px 24px 60px;
            text-align: center;
            background: radial-gradient(120% 60% at 50% 0%, rgba(37, 99, 235, 0.08) 0%, var(--bg-light) 60%);
        }
        .generator-header h1 {
            font-size: clamp(32px, 5vw, 48px);
            margin-bottom: var(--space-xs);
        }
        .generator-header p {
            color: var(--text-secondary);
            font-size: 16px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto var(--space-4);
            background: var(--bg-surface);
            padding: var(--space-4);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-premium);
            border: 1px solid var(--border-color);
        }
        #reportSection {
            display: none;
            max-width: 650px;
            margin: 30px auto;
            padding: var(--space-4);
            background: var(--bg-surface);
            border-left: 6px solid var(--primary);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-premium);
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            font-family: 'Times New Roman', serif;
            color: #000000;
        }
        #reportSection h3 {
            text-align: center;
            text-decoration: underline;
            margin-bottom: 15px;
            color: #000000;
        }
        #reportSection p {
            margin: 8px 0;
            line-height: 1.5;
            color: #000000;
        }
        #reportSection .action-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand" onclick="location.href='index.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Praxis
    </div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="feed.html">Explore Feed</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="donate.html">Support Us</a></li>
    </ul>
    <a href="report.html" class="cta-btn">Report a Spot</a>
</nav>

<div class="generator-header">
    <span class="badge">DOCUMENT GENERATOR</span>
    <h1>Report Generator</h1>
    <p>Generate a formal physical copy of your neighborhood cleanup request.</p>
</div>

<main class="section" style="padding-top: 0;">
    <div class="form-container">
        <form id="complaintForm">
            <div class="form-group">
                <label for="name"><strong>Full Name</strong></label>
                <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="date"><strong>Date</strong></label>
                <input type="date" id="date" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="location"><strong>Location</strong></label>
                <input type="text" id="location" class="form-control" placeholder="e.g. Kalyani Nagar, Pune" required>
            </div>

            <div class="form-group">
                <label for="details"><strong>Complaint Details</strong></label>
                <textarea id="details" rows="5" class="form-control" placeholder="Describe the structural or civic issues in detail..." required style="resize: vertical;"></textarea>
            </div>

            <button type="button" class="cta-btn" style="width: 100%; padding: 12px; border-radius: var(--radius-sm); font-size: 16px;" onclick="generateReport()">Generate Report</button>
        </form>
    </div>

    <div id="reportSection">
        <!-- Generated report will appear here -->
    </div>
</main>

<footer>
    <div class="footer-logo">Praxis</div>
    <p class="copy">&copy; 2026 Praxis NGO. All Rights Reserved.</p>
</footer>

<script>
function generateReport() {
  const name = document.getElementById('name').value;
  const date = document.getElementById('date').value;
  const location = document.getElementById('location').value;
  const details = document.getElementById('details').value;

  if (!name || !date || !location || !details) {
    alert("Please fill all fields.");
    return;
  }

  const report = `
    <h3>Formal Complaint Report</h3>
    <p><strong>Name:</strong> ${name}</p>
    <p><strong>Date:</strong> ${date}</p>
    <p><strong>Location:</strong> ${location}</p>
    <p><strong>Complaint Details:</strong><br>${details}</p>
    <br>
    <p style="text-align:right;"><strong>Authority Signature:</strong> ____________________</p>
    <div class="action-btns">
      <button class="cta-btn" onclick="printReport()">Print Report</button>
      <button class="cta-btn secondary" onclick="goBack()">Back to Reports Database</button>
    </div>
  `;

  const section = document.getElementById('reportSection');
  section.innerHTML = report;
  section.style.display = 'block';
  section.scrollIntoView({ behavior: 'smooth' });
}

function printReport() {
  const reportContent = document.getElementById('reportSection').innerHTML;
  const originalContent = document.body.innerHTML;

  document.body.innerHTML = reportContent;
  window.print();
  document.body.innerHTML = originalContent;
  window.location.reload(); // Reload to restore page state and bindings safely
}

function goBack() {
  window.location.href = "complaint_reports.html";
}
</script>

</body>
</html>
